<title>Família no Parque · Caderno de Ideias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@75..125,300..700&family=Nunito:wght@400..900&display=swap">
<style>
/* Layout: canvas infinito roxo-noite; 52 quadros 16:9 por capítulo; câmera voa entre eles (zoom-out = índice) */
:root{
  --noite:#1C0B36; --roxo:#6A2BB5; --roxo-2:#3E1673; --ink:#26124A; --mute:#6D5D8B;
  --amarelo:#FFC62E; --laranja:#FF7A1A; --vermelho:#EE4430; --verde:#2FBF63; --azul:#2AB1EE; --rosa:#FF62A5;
  --papel:#FFF8EC; --branco:#FFFFFF;
  --f-display:"Fredoka","Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-back:cubic-bezier(.34,1.5,.64,1);
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--noite);overflow:hidden;color:var(--branco)}
body{font-family:var(--f-body);-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;overflow:hidden;background-color:var(--noite);
  background-image:radial-gradient(circle,rgba(255,255,255,.13) 1.4px,transparent 1.6px);touch-action:none;cursor:default}
#app.ov{cursor:grab}#app.ov.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#trail{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#trail path{fill:none;stroke:rgba(255,255,255,.22);stroke-width:10;stroke-dasharray:4 30;stroke-linecap:round}

/* rótulos de capítulo no canvas */
.rowlabel{position:absolute;width:1400px;text-align:right;font-family:var(--f-display);color:var(--branco);pointer-events:none}
.rowlabel b{display:block;font-size:380px;line-height:.9;font-weight:700;color:var(--lc)}
.rowlabel span{display:block;font-size:120px;line-height:1;font-weight:600;text-wrap:balance}

/* ===== quadro ===== */
.slide{position:absolute;width:1920px;height:1080px;border-radius:44px;overflow:hidden;background:var(--papel);color:var(--ink);
  box-shadow:0 26px 60px rgba(6,0,20,.5);--k:1}
#app.ov .slide{cursor:pointer}
#app.ov .slide:hover{outline:24px solid var(--amarelo);outline-offset:18px}
.si{position:absolute;inset:0;padding:80px 110px 56px;display:flex;flex-direction:column}
.kick{align-self:flex-start;font-family:var(--f-display);font-variation-settings:"wdth" 75;font-weight:600;text-transform:uppercase;
  letter-spacing:.07em;font-size:25px;line-height:1;padding:12px 24px 11px;border-radius:999px;background:var(--c);color:var(--cf);rotate:-2deg}
.title{font-family:var(--f-display);font-weight:600;font-size:66px;line-height:1.05;letter-spacing:-.01em;margin:26px 0 0;max-width:1560px;white-space:nowrap;color:var(--ink)}
.wm{display:inline-block;overflow:hidden;padding:.12em .03em .16em;margin:-.12em -.03em -.16em;vertical-align:top}
.wm>span{display:inline-block}
.sub{font-size:27px;line-height:1.4;color:var(--mute);margin:16px 0 0;max-width:1560px;min-height:2.8em;text-wrap:pretty}
.sb{flex:1;min-height:0;margin-top:36px;display:flex;flex-direction:column;gap:28px}
.sf{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-variation-settings:"wdth" 80;font-weight:500;
  text-transform:uppercase;letter-spacing:.09em;font-size:17px;color:var(--mute);padding-top:18px;border-top:2px dashed rgba(38,18,74,.14);margin-top:22px}
.sf b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}

/* mascotes e rabiscos */
.mz{display:block;overflow:visible}
.mz .eyes{transform-box:fill-box;transform-origin:center}
.mz .pup{transform-box:view-box}
.deco{position:absolute;pointer-events:none}
.peek{width:300px;right:-70px;top:-80px;rotate:-14deg}
.peek2{width:240px;right:60px;bottom:-110px;rotate:10deg}
.doodle{fill:none;stroke-linecap:round;stroke-linejoin:round}
.spark{fill:var(--c)}

/* nota (post-it) */
.note{position:relative;display:flex;align-items:center;gap:22px;background:color-mix(in srgb,var(--c) 20%,#fff);
  border-radius:22px;padding:18px 34px 18px 26px;font-size:24px;font-weight:700;line-height:1.35;color:var(--ink);flex:none}
.note::before{content:"";position:absolute;left:54px;top:-14px;width:120px;height:28px;background:color-mix(in srgb,var(--amarelo) 75%,transparent);rotate:-4deg;border-radius:4px}
.note .mz{width:58px;flex:none}

/* trio */
.trio{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto auto 1fr;column-gap:30px;row-gap:0}
.card{position:relative;display:grid;grid-row:span 3;grid-template-rows:subgrid;align-content:start;border-radius:34px;padding:40px 40px 40px;background:var(--cc);color:var(--ccf);min-width:0}
.ctop:empty{display:none}.ctop{margin-bottom:18px}
.cb{min-width:0}
.card h3{font-family:var(--f-display);font-weight:600;font-size:calc(var(--k)*36px);line-height:1.1;margin:0 0 16px;align-self:start;text-wrap:balance}

.card p{font-size:calc(var(--k)*25px);line-height:1.45;margin:0;font-weight:600}
.card .mz.ic{position:absolute;right:26px;bottom:22px;width:88px;rotate:-8deg}
.card.flow:not(:last-child)::after{content:"";position:absolute;right:-31px;top:50%;width:32px;height:32px;margin-top:-16px;z-index:2;
  background:var(--ink);clip-path:polygon(0 15%,60% 15%,60% 0,100% 50%,60% 100%,60% 85%,0 85%)}
.stepn{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--branco);font-family:var(--f-display);font-weight:600;font-size:28px}
.tags{display:flex;flex-wrap:wrap;gap:10px}
.tag{background:rgba(255,255,255,.88);color:var(--ink);border-radius:999px;padding:8px 18px;font-size:calc(var(--k)*23px);font-weight:800;line-height:1.2}
.tagfoot{margin-top:16px!important;font-size:calc(var(--k)*21px)!important;opacity:.85}
.splitlbl{font-family:var(--f-display);font-variation-settings:"wdth" 75;font-weight:600;text-transform:uppercase;letter-spacing:.09em;font-size:19px;opacity:.75;margin:14px 0 6px}
.splitlbl:first-of-type{margin-top:0}
/* carimbo das missões */
.stamp{position:absolute;bottom:28px;right:28px;width:128px;height:128px;border-radius:50%;border:5px dashed var(--ink);display:grid;place-items:center;
  font-family:var(--f-display);font-weight:700;font-size:64px;color:var(--ink);background:var(--branco);rotate:12deg}
.card .mlabel{font-family:var(--f-display);font-variation-settings:"wdth" 75;font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:22px;opacity:.8;display:block;margin-bottom:6px}
/* reels */
.reels{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:70px;align-items:stretch}
.phone{position:relative;border-radius:52px;border:14px solid var(--ink);background:var(--cc);color:var(--ccf);padding:70px 34px 96px}
.phone::before{content:"";position:absolute;top:16px;left:50%;width:110px;height:22px;margin-left:-55px;border-radius:12px;background:var(--ink)}
.phone h3{font-family:var(--f-display);font-variation-settings:"wdth" 75;font-weight:700;text-transform:uppercase;font-size:calc(var(--k)*44px);line-height:1;letter-spacing:.01em;margin:0 0 18px;
  color:var(--branco);-webkit-text-stroke:0;text-shadow:0 4px 0 var(--ink)}
.phone p{font-size:calc(var(--k)*25px);line-height:1.42;margin:0;font-weight:700}
.phone .play{position:absolute;right:26px;bottom:26px;width:54px;height:54px;border-radius:50%;background:var(--ink);opacity:.9}
.phone .play::after{content:"";position:absolute;left:21px;top:16px;border-left:18px solid var(--branco);border-top:11px solid transparent;border-bottom:11px solid transparent}
.phone:not(:last-child)::after{content:"";position:absolute;right:-56px;top:46%;width:40px;height:40px;background:var(--ink);
  clip-path:polygon(0 15%,60% 15%,60% 0,100% 50%,60% 100%,60% 85%,0 85%)}


/* quad (proposta / experiência / produtos / pontos) */
.quad{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.22fr);grid-template-rows:auto auto;align-content:stretch;gap:24px}
.q{position:relative;border-radius:32px;padding:30px 36px;min-width:0;min-height:0}
.lbl{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-variation-settings:"wdth" 75;font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:21px;margin-bottom:calc(var(--k)*14px);opacity:.85}
.lbl i{display:inline-block;width:14px;height:14px;border-radius:50%;background:currentColor}
.q-prop{background:var(--c);color:var(--cf)}
.q-prop p{margin:0;font-family:var(--f-display);font-weight:500;font-size:calc(var(--k)*30px);line-height:1.3;text-wrap:pretty}
.q-prop .mz{position:absolute;right:-18px;bottom:-26px;width:120px;rotate:-10deg}
.q-exp{background:var(--branco);box-shadow:inset 0 0 0 2px rgba(38,18,74,.07)}
.path{display:flex;flex-wrap:wrap;gap:10px 6px;align-items:center}
.step{background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:14px;padding:7px 15px;font-size:calc(var(--k)*22px);font-weight:700;line-height:1.25}
.arr{width:22px;height:16px;flex:none;background:var(--c);clip-path:polygon(0 30%,55% 30%,55% 0,100% 50%,55% 100%,55% 70%,0 70%)}
.tl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:calc(var(--k)*12px) 18px;align-items:baseline;margin:0}
.tm{font-family:var(--f-display);font-weight:600;font-size:calc(var(--k)*22px);background:var(--c);color:var(--cf);border-radius:10px;padding:3px 12px;text-align:center;font-variant-numeric:tabular-nums}
.tl dd{margin:0;font-size:calc(var(--k)*22px);font-weight:700;line-height:1.3}
.num{list-style:none;margin:0;padding:0;display:grid;gap:calc(var(--k)*9px);counter-reset:n}
.num li{counter-increment:n;display:flex;gap:14px;align-items:baseline;font-size:calc(var(--k)*22px);font-weight:700;line-height:1.3}
.num li::before{content:counter(n);flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--c);color:var(--cf);font-family:var(--f-display);font-size:20px}
.expnote,.expre{font-size:calc(var(--k)*21px);font-weight:600;color:var(--mute);margin:calc(var(--k)*12px) 0 0}
.expre{margin:0 0 calc(var(--k)*12px)}
.q-prod{background:var(--pc);color:var(--pcf)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:rgba(255,255,255,.9);color:var(--ink);border-radius:999px;padding:7px 17px;font-size:calc(var(--k)*21px);font-weight:800;line-height:1.25}
.chip.price{background:var(--ink);color:var(--amarelo)}
.prodnote{margin:calc(var(--k)*12px) 0 0;font-size:calc(var(--k)*21px);font-weight:700;opacity:.9}
.q-pts{border:3px dashed rgba(38,18,74,.22);background:rgba(255,255,255,.35)}
.checks{list-style:none;margin:0;padding:0;columns:2;column-gap:30px}
.checks li{break-inside:avoid;display:flex;gap:12px;align-items:baseline;font-size:calc(var(--k)*21px);font-weight:700;line-height:1.3;margin-bottom:calc(var(--k)*9px)}
.checks li::before{content:"";flex:none;width:20px;height:20px;border-radius:6px;border:3px solid var(--c);translate:0 3px}
.ptslead{margin:0 0 10px;font-size:calc(var(--k)*22px);font-weight:800}
.dist{display:grid;gap:6px;margin-right:110px}
.dist div{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:12px;font-family:var(--f-display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.dist span{height:14px;border-radius:999px;background:rgba(255,255,255,.92);transform-origin:left center}
.expsplit{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px;align-items:start}
.distlbl{margin:0 0 10px;font-size:19px;font-weight:700;color:var(--mute);line-height:1.3}
.cols{display:flex;align-items:flex-end;gap:14px;height:160px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.cols span{width:100%;border-radius:8px 8px 3px 3px;background:var(--c);transform-origin:bottom center}
.cols b{font-family:var(--f-display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.slide.pre .a-y{transform:scaleY(0)}
.slide.on .a-y{transition:transform 1s var(--ease-out) var(--t)}
.q-prop .dist div{grid-template-columns:84px 1fr;font-size:19px}

/* comparativo (diagnóstico) */
.cmp{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px}
.pn{border-radius:34px;padding:40px;position:relative}
.pn h3{font-family:var(--f-display);font-weight:600;font-size:calc(var(--k)*36px);margin:0 0 22px}
.bub{position:relative;display:inline-block;background:var(--branco);color:var(--ink);font-family:var(--f-display);font-weight:500;font-size:calc(var(--k)*36px);line-height:1.15;
  border-radius:28px;padding:18px 28px;margin:0 0 calc(var(--k)*22px)}
.bub::after{content:"";position:absolute;left:34px;bottom:-16px;border-left:22px solid var(--branco);border-bottom:18px solid transparent}
.pn p{font-size:calc(var(--k)*26px);line-height:1.45;font-weight:700;margin:0 0 12px}
.pn .org{font-size:calc(var(--k)*21px);font-weight:600;opacity:.85;margin:0}
.pn .mz{position:absolute;right:30px;top:26px;width:84px;rotate:-8deg}

/* linha do tempo em escala */
.tline{position:relative;flex:1;min-height:0;margin:10px 30px 0}
.axis{position:absolute;left:0;right:0;top:50%;height:36px;margin-top:-18px;border-radius:999px;background:rgba(38,18,74,.08)}
.band{position:absolute;top:50%;height:36px;margin-top:-18px;border-radius:999px;transform-origin:left center}
.bandl{position:absolute;top:calc(50% + 24px);font-family:var(--f-display);font-variation-settings:"wdth" 75;font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:22px;color:var(--mute)}
.hour{position:absolute;top:50%;margin-top:-11px;line-height:22px;font-family:var(--f-display);font-weight:600;font-size:17px;color:var(--ink);opacity:.55;translate:-50% 0;font-variant-numeric:tabular-nums;z-index:1}
.ev{position:absolute;width:270px}
.ev{z-index:2}.ev.up{bottom:calc(50% + 40px)} .ev.dn{top:calc(50% + 76px)}
.ev .dot{position:absolute;left:-14px;width:28px;height:28px;border-radius:50%;background:var(--branco);border:7px solid var(--ink)}
.ev.up .dot{bottom:-54px}.ev.dn .dot{top:-90px}
.ev.r{text-align:right}.ev.r .dot{left:auto;right:-14px}
.ev .stick{position:absolute;left:-2px;width:4px;background:var(--ink);opacity:.25}
.ev.up .stick{bottom:-26px;height:26px}.ev.dn .stick{top:-62px;height:62px}
.ev.r .stick{left:auto;right:-2px}
.ev b{display:inline-block;font-family:var(--f-display);font-weight:600;font-size:34px;background:var(--ink);color:var(--amarelo);border-radius:12px;padding:2px 14px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.ev p{margin:0;font-size:24px;font-weight:700;line-height:1.3}

/* capa */
.cover{background:var(--roxo-2);color:var(--branco)}
.cover .si{padding:110px 120px 80px;justify-content:center}
.cover .kick{background:var(--amarelo);color:var(--ink);font-size:30px}
.cover h1{font-family:var(--f-display);font-weight:600;font-size:132px;line-height:.98;letter-spacing:-.015em;margin:40px 0 0;max-width:1100px;text-wrap:balance}
.cover h1 em{font-style:normal;color:var(--amarelo)}
.cover .lead{font-size:34px;line-height:1.4;max-width:900px;margin:36px 0 0;font-weight:600;color:rgba(255,255,255,.88)}
.cover .meta{margin-top:auto;font-family:var(--f-display);font-variation-settings:"wdth" 80;text-transform:uppercase;letter-spacing:.12em;font-size:22px;font-weight:500;color:rgba(255,255,255,.75)}
.cover .hint{display:inline-flex;gap:10px;align-items:center;margin-left:28px;color:var(--amarelo)}
.kbd{display:inline-grid;place-items:center;min-width:38px;height:34px;border-radius:9px;border:2px solid currentColor;font-size:18px;padding:0 6px}
.cv1{width:820px;right:-150px;top:-120px}
.cv2{width:520px;right:330px;bottom:-190px;rotate:-16deg}
.cv3{width:300px;right:60px;bottom:120px;rotate:14deg}

/* capítulo */
.chap{background:var(--c);color:var(--cf)}
.chap .si{padding:96px 120px 70px}
.chap .cnum{font-family:var(--f-display);font-weight:700;font-size:420px;line-height:.8;letter-spacing:-.03em;color:transparent;-webkit-text-stroke:6px var(--cf);opacity:.9}
.chap h2{font-family:var(--f-display);font-weight:600;font-size:132px;line-height:.98;margin:36px 0 0;max-width:1150px;text-wrap:balance}
.chap .toc{margin-top:auto;display:grid;grid-template-columns:repeat(2,minmax(0,560px));gap:10px 50px;list-style:none;padding:0;max-width:1180px}
.chap .toc li{display:flex;gap:14px;align-items:baseline;font-size:31px;font-weight:700;line-height:1.25}
.chap .toc li b{font-family:var(--f-display);font-weight:600;font-size:22px;opacity:.7;font-variant-numeric:tabular-nums;flex:none}
.chap .big{width:760px;right:-120px;bottom:-200px;rotate:-12deg}
.chap .small{width:250px;right:520px;top:90px;rotate:16deg}

/* ===== movimento ===== */
.measure .a{transform:none!important;translate:none}
.a{transition:none}
.slide.pre .a-up{opacity:0;transform:translateY(46px)}
.slide.pre .a-w{transform:translateY(108%)}
.slide.pre .a-pop{opacity:0;transform:scale(.82) translateY(26px)}
.slide.pre .a-fade{opacity:0}
.slide.pre .a-x{transform:scaleX(0)}
.slide.pre .a-mz{opacity:0;transform:translateY(80px) scale(.7) rotate(-10deg)}
.slide.pre .a-stamp{opacity:0;transform:scale(1.8) rotate(-20deg)}
.slide.pre .doodle path{stroke-dashoffset:1}
.doodle path{stroke-dasharray:1;stroke-dashoffset:0}
.slide.on .a{--t:calc(var(--d,0) * 70ms + 160ms)}
.slide.on .a-up{transition:transform .9s var(--ease-out) var(--t),opacity .6s ease var(--t)}
.slide.on .a-w{transition:transform .85s var(--ease-out) var(--t)}
.slide.on .a-pop{transition:transform .8s var(--ease-back) var(--t),opacity .45s ease var(--t)}
.slide.on .a-fade{transition:opacity .9s ease var(--t)}
.slide.on .a-x{transition:transform 1.1s var(--ease-out) var(--t)}
.slide.on .a-mz{transition:transform 1s var(--ease-back) var(--t),opacity .5s ease var(--t)}
.slide.on .a-stamp{transition:transform .5s var(--ease-back) var(--t),opacity .2s ease var(--t)}
.slide.on .doodle path{transition:stroke-dashoffset 1.2s var(--ease-out) var(--t)}
/* ambiente: só no quadro ativo */
.amb{animation-play-state:paused!important}
.slide.on .amb{animation-play-state:running!important}
#app.ov .amb,#app.moving .amb{animation-play-state:paused!important}
.float{animation:float 6.5s ease-in-out infinite alternate}
.float.b{animation-duration:8s;animation-delay:-3s}
.mz .eyes{animation:blink 5.2s infinite}
.mz .pup{animation:look 7s ease-in-out infinite}
@keyframes float{from{translate:0 0}to{translate:0 -18px}}
@keyframes blink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}
@keyframes look{0%,30%{transform:translate(0,0)}38%,60%{transform:translate(5px,-3px)}68%,90%{transform:translate(-5px,2px)}100%{transform:translate(0,0)}}

/* ===== HUD ===== */
#hud{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));translate:-50% 0;display:flex;align-items:center;gap:6px;
  padding:6px;border-radius:999px;background:rgba(20,6,40,.94);
  box-shadow:0 10px 30px rgba(0,0,0,.35);transition:opacity .4s ease;max-width:calc(100vw - 24px);z-index:5}
#hud.idle{opacity:.18}
#hud button{all:unset;cursor:pointer;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--branco);flex:none}
#hud button:hover{background:rgba(255,255,255,.12)}
#hud button:focus-visible{outline:3px solid var(--amarelo);outline-offset:1px}
#hud button[aria-pressed="true"]{background:var(--amarelo);color:var(--ink)}
#hud svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#where{min-width:0;padding:0 10px;display:flex;flex-direction:column;line-height:1.15;font-family:var(--f-display)}
#where small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
#where span{font-size:14px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- utilitários ---------- */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pad=n=>String(n).padStart(2,'0');
const words=(t,d0=0)=>esc(t).split(' ').map((w,i)=>`<span class="wm"><span class="a a-w" style="--d:${d0+i*.6}">${w}</span></span>`).join(' ');
function shapePath(s){
  switch(s){
    case 'ball':return '<circle cx="100" cy="104" r="88"/>';
    case 'drop':return '<path d="M100 192C58 166 12 118 16 70 20 30 56 16 100 16s80 14 84 54c4 48-42 96-84 122Z"/>';
    case 'squircle':return '<rect x="14" y="18" width="172" height="172" rx="66"/>';
    case 'bean':return '<path d="M36 70C54 18 150 12 176 72c22 50-10 116-74 116C34 188 18 120 36 70Z"/>';
    default:return '<rect x="8" y="46" width="184" height="124" rx="62"/>';
  }
}
function mascot(shape,col,cls='',smile=true){
  const [c]=C[col]||[col];
  return `<svg class="mz ${cls}" viewBox="0 0 200 210" aria-hidden="true"><g fill="${c}">${shapePath(shape)}</g>
  <g class="eyes"><ellipse cx="78" cy="96" rx="17" ry="21" fill="#fff"/><ellipse cx="122" cy="96" rx="17" ry="21" fill="#fff"/>
  <g class="pup amb"><circle cx="81" cy="100" r="9" fill="#26124A"/><circle cx="125" cy="100" r="9" fill="#26124A"/><circle cx="84" cy="96" r="3" fill="#fff"/><circle cx="128" cy="96" r="3" fill="#fff"/></g></g>
  ${smile?'<path d="M86 136q14 12 28 0" fill="none" stroke="#26124A" stroke-width="6" stroke-linecap="round"/>':''}
  <ellipse cx="58" cy="128" rx="10" ry="6" fill="#FF62A5" opacity=".45"/><ellipse cx="142" cy="128" rx="10" ry="6" fill="#FF62A5" opacity=".45"/></svg>`;
}
const squiggle=(col,cls,d=0)=>`<svg class="deco doodle ${cls} a" style="--d:${d}" viewBox="0 0 220 40" aria-hidden="true"><path pathLength="1" stroke="${col}" stroke-width="7" d="M6 24q22-26 44 0t44 0 44 0 44 0 30-6"/></svg>`;
const spark=(col,style)=>`<svg class="deco a a-pop" viewBox="0 0 100 100" style="${style}" aria-hidden="true"><path fill="${col}" d="M50 0l9 41 41 9-41 9-9 41-9-41L0 50l41-9z"/></svg>`;
const cc=(name)=>`--cc:${C[name][0]};--ccf:${C[name][1]}`;
const cardColors=(ci)=>{const i=ROT.indexOf(CH[ci].c);return [0,2,4].map(j=>ROT[(i+j)%7]);};

/* ---------- montagem da sequência ---------- */
const deck=[{t:'cover'}];
CH.forEach((c,ci)=>{deck.push({t:'chap',ch:ci});S.filter(s=>s.ch===ci).forEach(s=>deck.push(s));});
const TOTAL=deck.length;

function head(s){
  return `<span class="kick a a-pop" style="--d:0">${esc(s.k)}</span><h2 class="title">${words(s.h,1)}</h2>${s.sub?`<p class="sub a a-up" style="--d:5">${esc(s.sub)}</p>`:''}`;
}
function noteHtml(s,i){
  if(!s.note)return '';
  return `<div class="note a a-up" style="--d:12">${mascot(SHAPES[(i+2)%5],ROT[(i+3)%7],'',true)}<span>${esc(s.note)}</span></div>`;
}
function foot(i,s){return `<footer class="sf a a-fade" style="--d:14"><span>Família no Parque · Ideias para conversa</span><span>${esc(CH[s.ch].name)}</span><b>${pad(i+1)} / ${TOTAL}</b></footer>`;}
function decoFor(i,s){
  const c=C[CH[s.ch].c][0];
  const shape=SHAPES[i%5], col=ROT[(ROT.indexOf(CH[s.ch].c)+1+i)%7];
  let h=`<div class="deco peek a a-mz" style="--d:3"><div class="float amb">${mascot(shape,col)}</div></div>`;
  h+=spark(c,`width:50px;right:300px;top:40px;--d:6`)+spark(C[col][0],`width:28px;right:262px;top:108px;--d:8`);
  if(s.clock)h+=`<svg class="deco a a-pop" style="--d:7;width:220px;right:340px;top:40px;rotate:-8deg" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#26124A" stroke-width="6"/>${[...Array(12)].map((_,k)=>`<line x1="50" y1="10" x2="50" y2="16" stroke="#26124A" stroke-width="4" stroke-linecap="round" transform="rotate(${k*30} 50 50)"/>`).join('')}<line x1="50" y1="50" x2="50" y2="20" stroke="#EE4430" stroke-width="6" stroke-linecap="round"/><line x1="50" y1="50" x2="50" y2="28" stroke="#26124A" stroke-width="7" stroke-linecap="round"/><circle cx="50" cy="50" r="5" fill="#26124A"/></svg>`;
  return h;
}

/* ---------- templates ---------- */
const T={};
T.cover=(i)=>`<section class="slide cover" style="--c:${C.amarelo[0]};--cf:${C.amarelo[1]}" aria-label="Capa">
  <div class="deco cv1 a a-mz" style="--d:2"><div class="float amb">${mascot('ball','laranja')}</div></div>
  <div class="deco cv2 a a-mz" style="--d:5"><div class="float b amb">${mascot('squircle','verde','',false)}</div></div>
  <div class="deco cv3 a a-mz" style="--d:8"><div class="float amb">${mascot('drop','amarelo')}</div></div>
  ${spark('#FF62A5','width:70px;left:1040px;top:120px;--d:9')}${spark('#2AB1EE','width:40px;left:1110px;top:220px;--d:10')}
  ${squiggle('#FFC62E','',11).replace('class="deco','style="position:absolute;width:260px;left:124px;top:770px;--d:11" class="deco')}
  <div class="si">
    <span class="kick a a-pop" style="--d:1">Família no Parque</span>
    <h1>${words('Ideias para ampliar a',2)} <em>${words('experiência do parque',6)}</em></h1>
    <p class="lead a a-up" style="--d:10">O caderno reúne novos produtos, atrações, temporadas, parcerias e experiências para famílias, adolescentes e adultos.</p>
    <p class="meta a a-fade" style="--d:13">Caderno de propostas · Outubro de 2026 <span class="hint"><span class="kbd">→</span> avançar <span class="kbd">I</span> índice</span></p>
  </div></section>`;
T.chap=(i,s)=>{const ch=CH[s.ch];const [c,cf]=C[ch.c];const items=S.filter(x=>x.ch===s.ch);const first=deck.indexOf(items[0]);
  const alt=ROT[(ROT.indexOf(ch.c)+3)%7];
  return `<section class="slide chap" style="--c:${c};--cf:${cf}" aria-label="Capítulo ${ch.n}: ${esc(ch.name)}">
  <div class="deco big a a-mz" style="--d:3"><div class="float amb">${mascot(SHAPES[s.ch%5],alt)}</div></div>
  <div class="deco small a a-mz" style="--d:7"><div class="float b amb">${mascot(SHAPES[(s.ch+2)%5],ROT[(ROT.indexOf(ch.c)+5)%7],'',false)}</div></div>
  <div class="si"><div class="cnum a a-up" style="--d:0">${ch.n}</div><h2>${words(ch.name,2)}</h2>
  <ol class="toc">${items.map((x,j)=>`<li class="a a-up" style="--d:${7+j*.8}"><b>${pad(first+j+1)}</b>${esc(x.h)}</li>`).join('')}</ol></div></section>`;};

function frame(i,s,body,extra=''){
  const [c,cf]=C[CH[s.ch].c];
  return `<section class="slide ${extra}" style="--c:${c};--cf:${cf}" aria-label="${esc(s.h)}">${decoFor(i,s)}<div class="si">${head(s)}<div class="sb">${body}</div>${foot(i,s)}</div></section>`;
}
function cardBody(card,v,j){
  const [h,p,f]=card;
  if(Array.isArray(p))return `<div class="tags">${p.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>${f?`<p class="tagfoot">${esc(f)}</p>`:''}`;
  if(v==='split'){const [a,b]=p.split('|');return `<span class="splitlbl">Segmentos</span><p>${esc(a)}</p><span class="splitlbl">Onde a marca aparece</span><p>${esc(b)}</p>`;}
  return `<p>${esc(p)}</p>`;
}
T.trio=T.pillars=(i,s)=>{
  const cols=cardColors(s.ch);const v=s.v||'';
  if(v==='reels'){
    const body=`<div class="reels">${s.cards.map((cd,j)=>`<div class="phone a a-pop" style="${cc(cols[j])};--d:${7+j*1.5}"><h3>${esc(cd[0])}</h3><p>${esc(cd[1])}</p><span class="play"></span></div>`).join('')}</div>${noteHtml(s,i)}`;
    return frame(i,s,body);
  }
  const body=`<div class="trio">${s.cards.map((cd,j)=>{
    let top='<span class="ctop"></span>',h=esc(cd[0]),abs='';
    if(v==='mission'){const [m,rest]=cd[0].split(':');abs=`<span class="stamp a a-stamp" style="--d:${10+j*2}">${j+1}</span>`;h=`<span class="mlabel">${esc(m)}</span>${esc(rest.trim())}`;}
    else if(v==='flow'){top=`<span class="ctop"><span class="stepn">${j+1}</span></span>`;}
    else abs=mascot(SHAPES[(i+j)%5],ROT[(ROT.indexOf(cols[j])+3)%7],'ic',j!==1);
    return `<article class="card ${v} a a-pop" style="${cc(cols[j])};--d:${7+j*1.4}">${top}<h3>${h}</h3><div class="cb">${cardBody(cd,v,j)}</div>${abs}</article>`;}).join('')}</div>${noteHtml(s,i)}`;
  return frame(i,s,body);
};
T.cmp=(i,s)=>{
  const P=(o,col,j)=>`<div class="pn a a-pop" style="background:${C[col][0]};color:${C[col][1]};--d:${7+j*2}">${mascot(j?'drop':'ball',j?'amarelo':'roxo','',!j)}
   <h3>${esc(o.h)}</h3>${o.q.map(q=>`<div><span class="bub">${esc(q)}</span></div>`).join('')}<p>${esc(o.p)}</p><p class="org">${esc(o.o)}</p></div>`;
  return frame(i,s,`<div class="cmp">${P(s.L,'verde',0)}${P(s.R,'laranja',1)}</div>${noteHtml(s,i)}`);
};
T.quad=(i,s)=>{
  const chc=CH[s.ch].c; const pc=chc==='amarelo'?'roxo':'amarelo';
  let exp='';
  let distH='';
  if(s.dist){const mx=Math.max(...s.dist);distH=`<div class="distw"><p class="distlbl">${esc(s.expPre)}</p><div class="cols">${s.dist.map((d,k)=>`<div><span class="a a-y" style="height:${(d/mx*130).toFixed(1)}px;--d:${9+k*.7}"></span><b>${d} m</b></div>`).join('')}</div></div>`;}
  else if(s.expPre)exp+=`<p class="expre">${esc(s.expPre)}</p>`;
  if(s.tl)exp+=`<dl class="tl">${s.tl.map(([t,d])=>`<dt class="tm">${esc(t)}</dt><dd>${esc(d)}</dd>`).join('')}</dl>`;
  else if(s.num)exp+=`<ol class="num">${s.exp.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`;
  else if(s.exp)exp+=`<div class="path">${s.exp.map((x,k)=>`${k?'<span class="arr"></span>':''}<span class="step">${esc(x)}</span>`).join('')}</div>`;
  if(s.expNote)exp+=`<p class="expnote">${esc(s.expNote)}</p>`;
  const chips=s.prod.map(x=>x.startsWith('$')?`<span class="chip price">${esc(x.slice(1))}</span>`:`<span class="chip">${esc(x)}</span>`).join('');
  const body=`<div class="quad">
   <div class="q q-prop a a-pop" style="--d:7"><div class="lbl"><i></i>A proposta</div><p>${esc(s.prop)}</p>${mascot(SHAPES[(i+3)%5],ROT[(ROT.indexOf(chc)+2)%7])}</div>
   <div class="q q-exp a a-pop" style="--d:8.5"><div class="lbl" style="color:var(--ink)"><i style="background:var(--c)"></i>Como seria a experiência</div>${distH?`<div class="expsplit"><div>${exp}</div>${distH}</div>`:exp}</div>
   <div class="q q-prod a a-pop" style="--pc:${C[pc][0]};--pcf:${C[pc][1]};--d:10"><div class="lbl"><i></i>Produtos e receitas possíveis</div><div class="chips">${chips}</div>${s.prodNote?`<p class="prodnote">${esc(s.prodNote)}</p>`:''}</div>
   <div class="q q-pts a a-pop" style="--d:11.5"><div class="lbl"><i style="background:var(--c)"></i>Pontos a combinar com o parque</div>${s.ptsLead?`<p class="ptslead">${esc(s.ptsLead)}</p>`:''}<ul class="checks">${s.pts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  </div>`;
  return frame(i,s,body);
};
T.timeline=(i,s)=>{
  const t0=10,t1=17.75,X=t=>((t-t0)/(t1-t0)*100);
  let h=`<div class="tline"><div class="axis"></div>`;
  s.bands.forEach(([n,a,b,col],k)=>{h+=`<div class="band a a-x" style="left:${X(a)}%;width:${X(b)-X(a)}%;background:${C[col][0]};--d:${7+k*1.5}"></div><div class="bandl a a-fade" style="left:${X(a)+.6}%;top:calc(50% + 26px);--d:${8+k*1.5}">${n}</div>`;});
  for(let hr=10;hr<=17;hr++)h+=`<span class="hour a a-fade" style="left:${X(hr)}%;--d:7">${hr}h</span>`;
  s.ev.forEach(([t,lab,txt],k)=>{const up=k%2===0, r=X(t)>60;
    h+=`<div class="ev ${up?'up':'dn'} ${r?'r':''} a a-pop" style="${r?`right:${100-X(t)}%`:`left:${X(t)}%`};--d:${8+k*.8}"><span class="stick"></span><span class="dot"></span><b>${lab}</b><p>${esc(txt)}</p></div>`;});
  h+='</div>';
  return frame(i,s,h+noteHtml(s,i));
};

/* ---------- canvas: posições ---------- */
const W=1920,H=1080,GX=220,GY=380,LBL=1700;
const app=document.getElementById('app'),world=document.getElementById('world');
const rows=[[0]];CH.forEach((c,ci)=>{const r=[];deck.forEach((d,k)=>{if(d.ch===ci)r.push(k)});rows.push(r);});
const pos=new Array(TOTAL);
rows.forEach((r,ri)=>r.forEach((k,ci)=>{pos[k]={x:LBL+ci*(W+GX),y:ri*(H+GY)};}));
let html='';
deck.forEach((d,k)=>{html+=T[d.t](k,d).replace('<section ',`<section data-i="${k}" `);});
// rótulos
rows.forEach((r,ri)=>{if(!ri){html+=`<div class="rowlabel" style="left:${LBL-1500}px;top:${pos[0].y+200}px;--lc:${C.amarelo[0]}"><b>★</b><span>Início</span></div>`;return;}
  const ch=CH[ri-1];html+=`<div class="rowlabel" style="left:${LBL-1500}px;top:${pos[r[0]].y+60}px;--lc:${C[ch.c][0]}"><b>${ch.n}</b><span>${esc(ch.name)}</span></div>`;});
world.insertAdjacentHTML('beforeend',html);
// estilos inline duplicados: o template já define style; mesclar
world.querySelectorAll('section.slide').forEach(el=>{
  const k=+el.dataset.i;el.style.left=pos[k].x+'px';el.style.top=pos[k].y+'px';
});
const slides=[...world.querySelectorAll('section.slide')].sort((a,b)=>a.dataset.i-b.dataset.i);
// trilha pontilhada
(()=>{let d='';for(let k=0;k<TOTAL;k++){const p=pos[k],cx=p.x+W/2,cy=p.y+H/2;
  if(!k){d+=`M${cx} ${cy}`;continue;}const q=pos[k-1];
  if(q.y===p.y)d+=` L${cx} ${cy}`;else{const y0=q.y+H,y1=p.y;d+=` M${q.x+W/2} ${q.y+H/2} L${q.x+W/2} ${y0} C${q.x+W/2} ${y0+GY*.9} ${cx} ${y1-GY*.9} ${cx} ${y1} L${cx} ${cy}`;}}
  document.getElementById('trailp').setAttribute('d',d);})();
let WB={x0:LBL-1550,y0:-100,x1:0,y1:0};pos.forEach(p=>{WB.x1=Math.max(WB.x1,p.x+W+100);WB.y1=Math.max(WB.y1,p.y+H+100);});

/* ---------- auto-encaixe de texto ---------- */
function fit(){app.classList.add('measure');slides.forEach(el=>{const tt=el.querySelector('.title');if(tt){let fs=66;while(tt.scrollWidth>tt.clientWidth+1&&fs>50){fs-=2;tt.style.fontSize=fs+'px';}}
  const sb=el.querySelector('.sb');if(!sb)return;let k=1;el.style.setProperty('--k',k);
  const over=()=>sb.scrollHeight>sb.clientHeight+10||[...sb.querySelectorAll('.q,.card,.pn,.phone')].some(b=>{const r=b.getBoundingClientRect().bottom;return [...b.children].some(c=>!c.classList.contains('mz')&&!c.classList.contains('stamp')&&!c.classList.contains('play')&&c.getBoundingClientRect().bottom>r-6);});
  let guard=0;while(over()&&guard<16){k-=.05;el.style.setProperty('--k',k.toFixed(2));guard++;}});app.classList.remove('measure');}

/* ---------- câmera ---------- */
const reduce=false; /* o movimento entre quadros fica sempre ativo, a pedido */
let vw=innerWidth,vh=innerHeight,cam={x:0,y:0,s:.1},cur=0,ov=false,anim=null;
const cy0=()=>(vh-64)/2;
const slideCam=k=>{const s=Math.min((vw-40)/W,(vh-96)/H);return {x:pos[k].x+W/2,y:pos[k].y+H/2,s};};
const ovCam=()=>{const w=WB.x1-WB.x0,h=WB.y1-WB.y0;return {x:WB.x0+w/2,y:WB.y0+h/2,s:Math.min(vw/w,(vh-80)/h)*.96};};
const vis=new Array(TOTAL).fill(true);
function apply(){
  const tx=vw/2-cam.x*cam.s,ty=cy0()-cam.y*cam.s;
  world.style.transform=`translate(${tx}px,${ty}px) scale(${cam.s})`;
  const g=60*cam.s;app.style.backgroundSize=`${g}px ${g}px`;app.style.backgroundPosition=`${tx}px ${ty}px`;
  const hw=vw/2/cam.s+200,hh=vh/2/cam.s+200;
  for(let k=0;k<TOTAL;k++){const p=pos[k];const v=!(p.x>cam.x+hw||p.x+W<cam.x-hw||p.y>cam.y+hh||p.y+H<cam.y-hh);
    if(v!==vis[k]){vis[k]=v;slides[k].style.visibility=v?'':'hidden';}}
}
const ease=t=>t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2;
function fly(to,dur,onMid,onEnd){
  if(anim)cancelAnimationFrame(anim.id);
  const from={...cam};const dx=to.x-from.x,dy=to.y-from.y;
  const dist=Math.hypot(dx,dy)/Math.max(W,1);
  const dip=Math.min(.34,.1+dist*.06)*(Math.abs(Math.log(to.s/from.s))<.3?1:.25);
  if(reduce||dur===0){cam={...to};apply();onMid&&onMid();onEnd&&onEnd();return;}
  dur=dur||Math.min(1500,850+dist*90);
  const t0=performance.now();let mid=false;app.classList.add('moving');
  const step=now=>{const p=Math.min(1,(now-t0)/dur),e=ease(p);
    const ls=Math.log(from.s)+(Math.log(to.s)-Math.log(from.s))*e;
    cam={x:from.x+dx*e,y:from.y+dy*e,s:Math.exp(ls)*(1-dip*Math.sin(Math.PI*p))};apply();
    if(!mid&&p>.58){mid=true;onMid&&onMid();}
    if(p<1)anim.id=requestAnimationFrame(step);else{anim=null;app.classList.remove('moving');onEnd&&onEnd();}};
  anim={id:requestAnimationFrame(step)};
}

/* ---------- navegação ---------- */
const wCh=document.getElementById('wCh'),wN=document.getElementById('wN'),prog=document.querySelector('#prog i'),bIdx=document.getElementById('bIdx');
function hud(){const d=deck[cur];wCh.textContent=d.t==='cover'?'Capa':(d.t==='chap'?`Capítulo ${CH[d.ch].n}`:CH[d.ch].name);
  wN.textContent=`${pad(cur+1)} / ${TOTAL}`;prog.style.width=((cur+1)/TOTAL*100)+'%';
  try{history.replaceState(null,'','#s'+(cur+1));}catch(e){}}
function activate(k){slides[k].classList.add('on');}
function settle(k){slides.forEach((el,j)=>{if(j!==k)el.classList.remove('on');});}
function go(k,dur){
  k=Math.max(0,Math.min(TOTAL-1,k));
  if(ov)leaveOv();
  const prev=cur;cur=k;hud();
  if(prev===k){fly(slideCam(k),dur,null,()=>{activate(k);settle(k);});return;}
  const el=slides[k];el.classList.remove('on');el.classList.add('pre');
  fly(slideCam(k),dur,()=>{el.classList.remove('pre');activate(k);},()=>settle(k));
}
function enterOv(){ov=true;app.classList.add('ov');bIdx.setAttribute('aria-pressed','true');slides.forEach(el=>el.classList.remove('pre'));fly(ovCam(),1300);}
function leaveOv(){ov=false;app.classList.remove('ov');bIdx.setAttribute('aria-pressed','false');}
function toggleOv(){if(ov){const k=cur;leaveOv();fly(slideCam(k),1200,null,()=>{activate(k);settle(k);});}else enterOv();}
document.getElementById('bPrev').onclick=()=>go(cur-1);
document.getElementById('bNext').onclick=()=>go(cur+1);
bIdx.onclick=toggleOv;
document.getElementById('bFs').onclick=()=>{try{const d=document;if(d.fullscreenElement)d.exitFullscreen();else d.documentElement.requestFullscreen().catch(()=>{});}catch(e){}};
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(['ArrowRight','PageDown',' ','Enter'].includes(k)){if(k==='Enter'&&ov){toggleOv();}else go(cur+1);e.preventDefault();}
  else if(['ArrowLeft','PageUp','Backspace'].includes(k)){go(cur-1);e.preventDefault();}
  else if(k==='ArrowDown'){const r=rows.findIndex(r=>r.includes(cur));if(rows[r+1])go(rows[r+1][0]);e.preventDefault();}
  else if(k==='ArrowUp'){const r=rows.findIndex(r=>r.includes(cur));if(rows[r-1])go(rows[r-1][0]);e.preventDefault();}
  else if(k==='Home')go(0);else if(k==='End')go(TOTAL-1);
  else if(k==='i'||k==='I')toggleOv();else if(k==='Escape'&&ov)toggleOv();
  else if(k==='f'||k==='F')document.getElementById('bFs').click();
  poke();});
/* índice: arrastar, zoom com roda, clique */
let drag=null;
app.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false,id:e.pointerId};});
app.addEventListener('pointermove',e=>{poke();if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)>6){drag.moved=true;if(ov){app.classList.add('drag');try{app.setPointerCapture(drag.id)}catch(_){}}}
  if(drag.moved&&ov){if(anim){cancelAnimationFrame(anim.id);anim=null;app.classList.remove('moving');}cam.x=drag.cx-dx/cam.s;cam.y=drag.cy-dy/cam.s;apply();}});
app.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;app.classList.remove('drag');
  const dx=e.clientX-d.x;
  if(!d.moved){if(ov){const el=e.target.closest('.slide');if(el){const k=+el.dataset.i;leaveOv();cur=k;hud();fly(slideCam(k),1200,null,()=>{activate(k);settle(k);});}}}
  else if(!ov&&Math.abs(dx)>50&&e.pointerType!=='mouse')go(cur+(dx<0?1:-1));});
app.addEventListener('wheel',e=>{if(!ov)return;e.preventDefault();if(anim){cancelAnimationFrame(anim.id);anim=null;app.classList.remove('moving');}
  const f=Math.exp(-e.deltaY*.0015),min=ovCam().s*.8,max=slideCam(0).s;const ns=Math.min(max,Math.max(min,cam.s*f));
  const wx=cam.x+(e.clientX-vw/2)/cam.s,wy=cam.y+(e.clientY-cy0())/cam.s;
  cam.x=wx-(e.clientX-vw/2)/ns;cam.y=wy-(e.clientY-cy0())/ns;cam.s=ns;apply();},{passive:false});
addEventListener('resize',()=>{vw=innerWidth;vh=innerHeight;cam=ov?ovCam():slideCam(cur);apply();});
/* HUD discreto em repouso */
const hudEl=document.getElementById('hud');let idleT;function poke(){hudEl.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>{if(!ov)hudEl.classList.add('idle')},2600);}
poke();

/* ---------- início ---------- */
const m=/^#s(\d+)$/.exec(location.hash);const start=m?Math.min(TOTAL,Math.max(1,+m[1]))-1:0;
cur=start;hud();
const boot=()=>{fit();const t=slideCam(start);cam={x:t.x+260,y:t.y+120,s:t.s*.62};apply();
  const el=slides[start];el.classList.add('pre');
  fly(t,reduce?0:1600,()=>{el.classList.remove('pre');activate(start);},()=>settle(start));};
let booted=false;const once=()=>{if(booted)return;booted=true;boot();};
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(once);setTimeout(once,1800);
})();
</script>
